<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #dcc91b, #ffd54f, #ffca28);
      background-size: 300% 300%;
    }

    .bmi-box {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      padding:2rem;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      width: 320px;
    }

    h1 {
      color: #333;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      text-align: center;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #fbc02d;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #f9a825;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 600;
      color: #333;
    }

    .status {
      margin-top: 10px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="bmi-box">
    <h1>BMI Calculator</h1>
    <input type="number" id="height" placeholder="Enter height (cm)">
    <input type="number" id="weight" placeholder="Enter weight (kg)">
    <button id="calculateBMI">Calculate</button>
    <div id="result">
        <!-- result here -->
    </div>
    <div class="status" id="status">
<!-- status here -->
    </div>
  </div>

  <script>

     const heightValue = document.querySelector("#height");
      const weightValue = document.querySelector("#weight");
      const result = document.querySelector("#result");
      const status = document.querySelector("#status");
      const Calculate = document.querySelector("#calculateBMI")
    function calculateBMI() {
        const height = heightValue.value
        const weight = weightValue.value
      if (height === "" || weight === "") {
        result.innerHTML = "⚠️ Please enter both height and weight.";
        status.innerHTML = "";
        return;
      }

      const heightInMeters = height / 100;
      const bmi = (weight / (heightInMeters **2)).toFixed(2);
      result.innerHTML = `Your BMI is: <strong>${bmi}</strong>`;

      if (bmi < 18.5) {
        status.innerHTML = "🟡 You are <b>Underweight</b>.";
        status.style.color = "#f57f17";
      } else if (bmi >= 18.5 && bmi < 25) {
        status.innerHTML = "🟢 You are <b>Healthy</b>.";
        status.style.color = "#388e3c";
      } else if (bmi >= 25 && bmi < 30) {
        status.innerHTML = "🟠 You are <b>Overweight</b>.";
        status.style.color = "#f57c00";
      } else {
        status.innerHTML = "🔴 You are <b>Obese</b>.";
        status.style.color = "#d32f2f";
      }
    }
    Calculate.addEventListener("click",calculateBMI)
  </script>
</body>
</html>
