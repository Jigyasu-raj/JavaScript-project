<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Slide Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 98%;
            height: 400px;
        
        }

        .container img {
            width: 100%;
            height: 400px;
            transition: all 1s ease-in-out;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="" alt="">
    </div>
    <script>
        const images = [

            "https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg?cs=srgb&dl=pexels-souvenirpixels-417074.jpg&fm=jpg",
            "https://images.pexels.com/photos/417173/pexels-photo-417173.jpeg",
            "https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg",
            "https://images.pexels.com/photos/257360/pexels-photo-257360.jpeg",
            "https://images.pexels.com/photos/414171/pexels-photo-414171.jpeg",

        ];

        let currentIndex = 0;
        const Img = document.querySelector("img");

        function changeBackground() {
            Img.src = `${images[currentIndex]}`;
            currentIndex = (currentIndex + 1) % images.length;
        }

        // Initial background
        changeBackground();

        // Change every 5 seconds
        setInterval(changeBackground, 3000);
    </script>

</body>

</html>
