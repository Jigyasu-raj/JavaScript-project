<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hex Color Generator</title>
  <style>
    *{margin:0;padding:0;font-family: sans-serif;box-sizing: border-box;}
    body{display: flex;justify-content: center;align-items: center;height:100vh;flex-direction: column;background: linear-gradient(135deg,blue,navy,#016992);color:white; }
    h1{margin-bottom:1rem;font-size:3rem;}
    button{width:150px;height:40px; border:none;outline:none;background-color: blue;color:white;padding:10px;border-radius: 6px;cursor: pointer;}
    #box{width:200px;height:150px;border:1px solid blue;background-color: white;}
    
  </style>
</head>
<body>
  <h1>🎨 Hex Color Generator</h1>

  <button id="btn">Generate Color</button>
  <h4>Hex Color</h4>
  <p id="hex">#ffffff</p>
  <div id="box"></div>

  <script>
    const btn = document.querySelector("#btn");
    const hex = document.querySelector("#hex");
    const box = document.querySelector("#box");

    btn.addEventListener("click", () => {
      const color = "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0");
      hex.textContent = color;
      box.style.background = color;
    });
  </script>
</body>
</html>
