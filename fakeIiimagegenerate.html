<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Generator</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #ffb300, #ffcc80);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 350px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    input {
      width: 80%;
      padding:10px 20px;
      border-radius: 10px;
      border: none;
      margin-bottom: 15px;
      outline: none;
      font-size: 16px;
    }

    button {
      background-color: #ff8f00;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #ff6f00;
    }

    img {
      width: 100%;
      margin-top: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .loading {
      font-size: 18px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🎨Fake AI Image Generator</h2>
    <input type="text" id="prompt" placeholder="Enter your image idea...">
    <button id="generateBtn">Generate Image</button>
    <p id="loading" class="loading"></p>
    <img id="image" src="" alt="">
  </div>

  <script>
    const generateBtn = document.querySelector("#generateBtn");
    const image = document.querySelector("#image");
    const loading = document.querySelector("#loading");
    const promptInput = document.querySelector("#prompt");

    // Random placeholder images (simulate AI results)
    const randomImages = [
      "https://picsum.photos/400/300?random=1",
      "https://picsum.photos/400/300?random=2",
      "https://picsum.photos/400/300?random=3",
      "https://picsum.photos/400/300?random=4",
      "https://picsum.photos/400/300?random=5"
    ];

    generateBtn.addEventListener("click", () => {
      const prompt = promptInput.value.trim();

      if (!prompt) {
        alert("⚠️ Please enter an image idea first!");
        return;
      }

      loading.textContent = "⏳ Generating image...";
      image.src = "";

      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * randomImages.length);
          loading.textContent = `✅ Result for: ${prompt}`;
        image.src = randomImages[randomIndex];
      
      }, 1500);
    });
  </script>
</body>
</html>
