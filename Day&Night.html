<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day & Night Greeting</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background 1s ease;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      text-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .emoji {
      font-size: 4rem;
      margin-top: 15px;
    }

    p {
      margin-top: 10px;
      font-size: 1.2rem;
      opacity: 0.9;
    }
    .time {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.5);
      padding: 8px 20px;
      border-radius: 10px;
      font-size: 1.1rem;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>
  <h1 id="greeting">
    <!-- greeting msg here -->
  </h1>
  <div class="emoji" id="emoji">
    <!-- imoji here -->
  </div>
  <p id="message">
    <!-- message here -->
  </p>
  <div class="time" id="time">
    <!-- current time here -->
  </div>

  <script>
    function updateGreeting() {
      const now = new Date();
      const hour = now.getHours();
      const greeting = document.querySelector("#greeting");
      const emoji = document.querySelector("#emoji");
      const message = document.querySelector("#message");
      const timeDiv = document.querySelector("#time");

      if (hour >= 5 && hour < 12) {
         greeting.textContent = "Good Morning 🌞";
        emoji.textContent = "☕";
        document.body.style.background  = "linear-gradient(to right, #FFEE88, #FFD580)";
        message.textContent = "Rise and shine! Have a productive morning!";
      } 
      else if (hour >= 12 && hour < 17) {
        greeting.textContent = "Good Afternoon ☀️";
        emoji.textContent = "😎";
        document.body.style.background = "linear-gradient(to right, #fbc2eb, #a6c1ee)";
        message.textContent = "Keep going strong this afternoon!";
      } 
      else if (hour >= 17 && hour < 20) {
        greeting.textContent = "Good Evening 🌇";
        emoji.textContent= "🌅";
        document.body.style.background = "linear-gradient(to right, #f7971e, #ffd200)";
        message.textContent = "Relax and enjoy your evening!";
      } 
      else {
        greeting.textContent = "Good Night 🌙";
        emoji.textContent = "🌌";
        document.body.style.background = "linear-gradient(to right, #0f2027, #203a43, #2c5364)";
        message.textContent = "Time to rest and recharge!";
      }

     // local time form system
     const timeString = now.toLocaleTimeString();
      timeDiv.textContent = `Current Time: ${timeString}`;
    }

    updateGreeting();
    setInterval(updateGreeting, 1000); // update every second
  </script>
</body>
</html>
