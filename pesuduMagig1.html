<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced ::before & ::after Magic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 30px;
        }

        section {
            margin: 40px 0;
        }

        /* 🌟 1. Gradient Border Magic */
        .gradient-border {
            position: relative;
            display: inline-block;
            padding: 15px 30px;
            background: #111;
            border-radius: 10px;
            z-index: 1;
        }

        .gradient-border::before {
            content:"";
            position: absolute;
            inset: -3px;
            background: linear-gradient(45deg, red, yellow, cyan, blue);
            border-radius: 12px;
            z-index: -10;
        }

        /* ✨ 2. Glowing Button */
        .glow-btn {
            position: relative;
            padding: 12px 25px;
            border: none;
            background: #111;
            color: white;
            cursor: pointer;
            border-radius: 30px;
            overflow: hidden;
        }

        .glow-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            opacity: 0;
            transition: 0.4s;
            z-index: -1;
        }

        .glow-btn:hover::after {
            opacity: 1;
        }
        /* 🚀 3. Tooltip Magic */
        .tooltip {
            position: relative;
            display: inline-block;
            cursor: pointer;
            color: yellow;
            font-weight: bold;
        }

        .tooltip::after {
            content: attr(data-tip);
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            background: black;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            opacity: 0;
            transition: 0.3s;
            white-space: nowrap;
        }

        .tooltip::before {
            content: "";
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: black;
            opacity: 0;
            transition: 0.3s;
        }

        .tooltip:hover::after,
        .tooltip:hover::before {
            opacity: 1;
        }

        /* 🎯 4. Stylish List Icons */
        ul {
            list-style: none;
            margin-top: 10px;
        }

        ul li {
            margin: 10px 0;
            font-size: 18px;
        }

        ul li::before {
            content: "✔ ";
            color: #00ffcc;
            font-weight: bold;
        }

        /* 💎 5. Ribbon Badge */
        .ribbon {
            position:relative;
            display: inline-block;
            padding: 15px 30px;
            background: crimson;
            border-radius: 5px;
        }

        .ribbon::before,
        .ribbon::after {
            content: "";
            position: absolute;
            bottom: -10px;
            border: 10px solid transparent;
        }

        .ribbon::before {
            left: 0;
            border-top-color: darkred;
        }

        .ribbon::after {
            right: 0;
            border-top-color: darkred;
        }
    </style>
</head>
<body>
    <h1>✨ Advanced ::before & ::after Magic ✨</h1>
    <section>
        <h2 class="gradient-border">Gradient Border</h2>
    </section>
    <section>
        <button class="glow-btn">Hover Me</button>
    </section>
    <section>
        <p>
            Hover on this
            <span class="tooltip" data-tip="This is a CSS Tooltip!">
                Tooltip
            </span>
        </p>
    </section>
    <section>
        <h2>Custom List Icons</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </section>
    <section>
        <div class="ribbon">New Offer</div>
    </section>
</body>
</html>
