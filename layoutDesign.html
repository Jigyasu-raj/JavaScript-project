<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Grid Layout</title>
  <style>
    * {
  margin: 0;
  font-family: Arial, sans-serif;
  box-sizing: border-box;
}

.container {
  display: grid;
  grid-template-areas:
    "header header"
    "nav main"
    "nav aside"
    "footer footer";
  grid-template-columns:200px 1fr;
  grid-template-rows: 60px 1fr 1fr 50px;
  gap: 10px;
  height: 100vh;
}

header {
  grid-area: header;
  background: #4CAF50;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}

nav {
  grid-area: nav;
  background: #f2f2f2;
  padding: 10px;
}

main {
  grid-area: main;
  background: #ddd;
  padding: 10px;
}

aside {
  grid-area: aside;
  background: #f4f4f4;
  padding: 10px;
}

footer {
  grid-area: footer;
  background: #333;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
}
@media screen and (max-width:600px){
   .container {
  grid-template-areas:
    "header"
    "nav"
    "main"
    "aside"
    "footer";
  grid-template-columns:1fr;
  grid-template-rows: 60px 50px 1fr 1fr 50px;
  gap:0px;
}    
}

  </style>
</head>
<body>
  <div class="container">
    <header>Header</header>
    <nav>Navigation</nav>
    <main>Main Content</main>
    <aside>Sidebar</aside>
    <footer>Footer</footer>
  </div>
</body>
</html>
