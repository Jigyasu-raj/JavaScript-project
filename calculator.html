<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;

        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        .container {
            height: 100%;
            width: 100%;
            background-color: blueviolet;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator {
            width: 400px;
            height: auto;
            padding: 15px;
            box-shadow: 0px 0px 2px black;
            border-radius: 8px;
            background-color: black;
        }

        .calculator input {
            width: 100%;
            height: 50px;
            outline: none;
            border: none;
            border-radius: 5px;

        }

        input[type="text"] {
            font-size: 20px;
            text-align: end;
            padding: 0px 10px;
            background-color: rgb(31, 30, 30);
            color: white;
        }

        .calculator .Button {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            margin: 5px 0px;
            gap: 5px;
        }

        .calculator .Button button {
            width: 100%;
            height: 40px;
            box-shadow: 0px 0px 2px black;
            cursor: pointer;
            font-size: 20px;
            background-color: black;
            color: white;
            border-radius: 8px;

        }

        .calculator .Button button.bg {
            background-color: orange;
        }
    </style>
</head>
<!-- ******************************************************************************************************************* -->

<body>
    <div class="container">
        <div class="calculator">
            <input type="text" id="inputBox" placeholder="0">
            <div class="Button">
                <button>AC</button>
                <button>DEL</button>
                <button>%</button>
                <button class="bg">/</button>
            </div>
            <div class="Button">
                <button>7</butthon>
                    <button>8</button>
                    <button>9</button>
                    <button class="bg">*</button>
            </div>
            <div class="Button">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="bg">-</button>
            </div>
            <div class="Button">
                <button>1</button>
                <button>2</butthon>
                    <button>3</butthon>
                        <button class="bg">+</butthon>
            </div>
            <div class="Button">
                <button>00</button>
                <button>0</button>
                <button>.</button>
                <button class="bg">=</button>
            </div>
        </div>
    </div>

    <!-- **************************************************************************************************** -->
    <script>
        let display = document.querySelector("#inputBox")
        let btn = document.querySelectorAll("button")
        btn.forEach(function (Values) {
            Values.addEventListener("click", function (event) {
                if (event.target.innerText == "AC") {
                    display.value = ""
                }
                else if (event.target.innerText == "DEL") {
                    display.value = display.value.slice(0, display.value.length - 1)
                }
                else if (event.target.innerText == "=") {
                    display.value = eval(display.value)
                }
                else {
                    display.value += event.target.innerText
                }


            })
        })
    </script>
</body>
