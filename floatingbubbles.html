<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Bubbles</title>
<style>
  body {
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
    overflow: hidden;
  }

  .bubble {
    position: absolute;
    bottom: -100px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(173,216,230,0.4));
    border-radius: 50%;
    opacity: 0.8;
    animation: floatUp 8s linear infinite;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translateY(-110vh) scale(1.5);
      opacity: 0;
    }
  }

  /* Random bubble positions and sizes */
  .bubble:nth-child(1) { left: 10%; width: 60px; height: 60px; animation-delay: 0s; }
  .bubble:nth-child(2) { left: 25%; width: 40px; height: 40px; animation-delay: 2s; }
  .bubble:nth-child(3) { left: 50%; width: 70px; height: 70px; animation-delay: 4s; }
  .bubble:nth-child(4) { left: 70%; width: 50px; height: 50px; animation-delay: 1s; }
  .bubble:nth-child(5) { left: 85%; width: 90px; height: 90px; animation-delay: 3s; }

</style>
</head>
<body>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
</body>
</html>
