<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Slide Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 98%;
            height: 400px;
         background: linear-gradient(to left, #f7971e , #ffd200 , #f44369);
         animation: autoSlide 2s linear 1s infinite;
        }

     
      
        @keyframes autoSlide {
           
            100%{
                background: linear-gradient(to right, #00c6ff, #0072ff, #00c6ff, #0072ff, #00c6ff, #0072ff);  
            }
            
        }
    </style>
</head>

<body>
    <div class="container">
    </div>
</body>

</html>
