<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111; /* Dark background for contrast */
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-card {
      width: 100%;
      max-width: 700px;
      background: linear-gradient(135deg, #ff0080, #ff8c00, #40e0d0);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .form-card iframe {
      width: 100%;
      height: 900px;
      border: none;
      border-radius: 15px;
    }

    /* Optional: make smaller screens shorter */
    @media(max-width: 600px){
      .form-card iframe{
        height: 700px;
      }
    }
  </style>
</head>
