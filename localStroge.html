<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Storage Playground</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing: border-box;
    }
  body {
    font-family: Poppins, sans-serif;
    background: linear-gradient(135deg, #89f7fe, #66a6ff);
    color: #222;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  h1 {
    margin-bottom: 10px;
  }

  .box {
    background: white;
    padding: 20px 25px;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    width: 320px;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    border: 2px solid #ccc;
    border-radius: 6px;
  }

  button {
    padding: 8px 12px;
    border: none;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    border-radius: 6px;
    color: #222;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    transform: scale(1.05);
  }

  ul {
    margin-top: 15px;
    padding-left: 20px;
  }

  li {
    margin-bottom: 6px;
  }

  .delete {
    color: red;
    cursor: pointer;
    margin-left: 10px;
  }

  .clear {
    background: #ff7a7a;
    color: white;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>🗂️ Local Storage Demo</h1>
<div class="box">
  <input type="text" id="key" placeholder="Enter key">
  <input type="text" id="value" placeholder="Enter value">
  <button id="addBtn">Add to Storage</button>
  <ul id="list"></ul>
  <button class="clear" id="clearBtn">Clear All</button>
</div>

<script>
  const keyInput = document.getElementById("key");
  const valueInput = document.getElementById("value");
  const list = document.getElementById("list");
  const addBtn = document.getElementById("addBtn");
  const clearBtn = document.getElementById("clearBtn");

  function updateList() {
    list.innerHTML = "";
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      const value = localStorage.getItem(key);
      const li = document.createElement("li");
      li.innerHTML = `<b>${key}</b>: ${value} 
                      <span class="delete" onclick="removeItem('${key}')">❌</span>`;
      list.appendChild(li);
    }
  }

  function removeItem(key) {
    localStorage.removeItem(key);
    updateList();
  }

  addBtn.addEventListener("click", () => {
    const key = keyInput.value.trim();
    const value = valueInput.value.trim();
    if (key && value) {
      localStorage.setItem(key, value);
      keyInput.value = "";
      valueInput.value = "";
      updateList();
    } else {
      alert("Please enter both key and value!");
    }
  });

  clearBtn.addEventListener("click", () => {
    if (confirm("Clear all data from local storage?")) {
      localStorage.clear();
      updateList();
    }
  });

  updateList(); // Load items on page start
</script>

</body>
</html>
