<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload file</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        html,body{
            display:flex;
            justify-content: center;
            align-items: center;
            width:100%;
            height:100%;
        }
        .container{
            width:30%;
            height:auto;
            padding:1rem;
            background-color:black;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
            border-radius: 10px;
        }
        .pic{
            width:150px;
            height:150px;
            border-radius:50%;
            background-color: white;
            object-fit:contain;
            overflow: hidden;
        }
        .pic img{
            width:100%;
            height:100%; 
            filter:contrast(1.2);      
        }
        .uploadfile{
            height:35px;
            background-color: #08a8e7;
            border-radius: 25px;
            margin:1rem;
            color:white;
            
        }
        input[type="file"]::file-selector-button{
             width:50%;
            height:35px;
            outline:none;
            border:none;
            color:white;
            background-color:#08a8e7;
            border-radius: 25px 0px 0px 25px;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="pic">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcShpioF-xi4bFhRAuMCfhSSFUVpBchghoELbw&s" alt="">
        </div>
        <div class="uploadfile">
            <input type="file" id="uploadfile" accept="image/*">
        </div>
    </div>
    
    <script>
        const uploadfile = document.querySelector("#uploadfile")
        uploadfile.addEventListener("change",function(){
               const pic = document.querySelector("img")

        const file = this.files[0]
         if(file){
            pic.src = URL.createObjectURL(file)
         }
         else{
            alert("file does not exist!")
         }
       
        })
       
    </script>
</body>
</html>
