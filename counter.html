<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>counter</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        html,body{
            display:flex;
            justify-content: center;
            align-items:center;
            height:100%;
        }
        .container
        {
            width:100%;
            height: auto;
            display:flex;
            justify-content: center;
            align-items: center;
            padding:1rem;
        }
        .counter
        {
            width:100px;
            height:100px;
            background-color: black;
            color:white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            margin:0px 1rem;
            border:5px solid green;
        }
    </style>
</head>
<body>
     <div class="container">
        <div class="counter">
        </div>
         <div class="counter">5</div>
          <div class="counter">7</div>
           <div class="counter">10</div>
            <div class="counter">45</div>
     </div>
     <script>
        const Counter = document.querySelectorAll(".counter")
       Counter.forEach(function(values){
        let startValue = values.innerHTML;
       const clearInter = setInterval(()=>{          
            startValue++
            let endValue = 100
            values.innerHTML = startValue+"%"
            if(startValue == endValue)
            {
                clearInterval(clearInter)
            }
        },100)
           
        })
        
      
    
     </script>
</body>
</html>
