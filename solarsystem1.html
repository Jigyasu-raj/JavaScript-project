<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            height:100vh;
            display:flex;
            justify-content: center;
            align-items: center;
            background: black;
          
        }
        .solar-system{
            position: relative;
            width:400px;
            height:400px;
            border-radius: 50%;        
            transform: rotateX(60deg) rotateY(-10deg);
            transform-style: preserve-3d;
          
        }
        .sun{
            position:absolute;
            height:100px;
            width:100px;
            background:radial-gradient(circle at center, yellow,orange);
            border-radius: 50%;
            box-shadow: 0 0 60px orange;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
            animation:move 6s linear infinite;
        }
        .orbits{
            position: absolute;
            border-radius: 50%;
            border:1px dotted gray;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
            transform-style: preserve-3d;

        }
        .budh-axis{
            width:200px;
            height:200px;
            border:1px dotted gray;
            animation:spin 6s linear infinite;
            
        }
          .budh{
            position: absolute;
            width:50px;
            height:50px;
            background: gray;
            border-radius: 50%;
            top:25px;

        }
        .earth-axis{
             width:300px;
             height:300px;
            animation:spin 8s linear infinite;
        }
          .earth{
            position: absolute;
            width:50px;
            height:50px;
            background: skyblue;
            border-radius: 50%;
            top:50px;

        }
        .mangal-axis{
            width:400px;
             height:400px;
              border:1px dotted gray;
              animation:spin 12s linear infinite;
        }
              .mangal{
            position: absolute;
            width:50px;
            height:50px;
            background:red;
            border-radius: 50%;
            top:75px;

        }  
        @keyframes move {
            from{
                transform: translate(-50%,-50%) rotateZ(0deg);
            }
              to{
                transform: translate(-50%,-50%) rotateZ(-360deg);
            }
        }   
        @keyframes spin {
            from{
                transform:translate(-50%,-50%) rotateZ(0deg);
            }
            to{
                transform:translate(-50%,-50%) rotateZ(360deg);
            }
            
        }
    </style>
</head>
<body>
    <div class="solar-system">
        <div class="sun"></div>
        <div class="orbits budh-axis">
            <div class="budh"></div>
            </div>
          <div class="orbits earth-axis">
            <div class="earth"></div>
        </div>
           <div class="orbits mangal-axis">
            <div class="mangal"></div>
        </div>
    </div>
</body>
</html>
