<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News App (Promise Version)</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #c9d6ff, #e2e2e2);
      color: #222;
    }

    header {
      background-color: #1e1e1e;
      color: #fff;
      text-align: center;
      padding: 15px 0;
      font-size: 1.8rem;
    }

    #newsContainer {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .news {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      padding: 15px;
      transition: transform 0.3s;
    }

    .news:hover {
      transform: scale(1.03);
    }

    .news img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
    }

    .news h2 {
      font-size: 1.2rem;
      margin: 10px 0 5px;
    }

    .news p {
      font-size: 0.9rem;
      color: #444;
    }

    .news a {
      display: inline-block;
      margin-top: 8px;
      color: #0078ff;
      text-decoration: none;
      font-weight: bold;
    }

    .news a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>📰 Latest News </header>

  <div id="newsContainer">Loading news...</div>

  <script>
    const container = document.querySelector("#newsContainer");

    // Fetch news using Promise chain (no async/await)
    const url = "https://newsdata.io/api/1/latest?apikey=YOUR_API_KEY&q=computer"
    function getNews() {
      container.innerHTML = "Loading news...";

      fetch(url)
        .then(response => {
          if (!response.ok) {
            throw new Error("Network response was not ok");
          }
          return response.json();
        })
        .then(data => {
            console.log(data)
          if (!data.articles || data.articles.length === 0) {
            container.innerHTML = "<p>⚠️ No news available right now.</p>";
            return;
          }

          container.innerHTML = "";
          
          data.articles.forEach(news => {
            const card = document.createElement("div");
            card.classList.add("news");
            card.innerHTML = `
              <img src="${news.urlToImage || 'https://via.placeholder.com/400x200'}" alt="News Image">
              <h2>${news.title}</h2>
              <p>${news.description || "No description available."}</p>
              <a href="${news.url}" target="_blank">Read more →</a>
            `;
            container.appendChild(card);
          });
        })
        .catch(error => {
          container.innerHTML = `<p>❌ Error loading news: ${error.message}</p>`;
        });
    }

    getNews();
  </script>
</body>
</html>
