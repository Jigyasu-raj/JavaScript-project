<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #f6d365, #fda085);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #222;
        }

        h1 {
            font-size: 2rem;
        }

        #timer {
            font-size:3rem;
            margin-top: 10px;
            background: #fff;
            padding: 15px 30px;
            border-radius: 10px;
            min-width: 120px;
        }

        input,
        button {
            padding: 10px 15px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            margin: 5px;
        }

        input {
            width: 80px;
            text-align: center;
        }

        button {
            background-color: #333;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>
    <h1>Countdown Timer ⏳</h1>

    <div>
        <input type="number" id="minutesInput" placeholder="Min" min="0">
        <input type="number" id="secondsInput" placeholder="Sec" min="0" max="59">
        <button id="startBtn">Start</button>
    </div>

    <div id="timer">
        00:00
    </div>

    <script>
        const timerDisplay = document.querySelector("#timer");
        const startBtn = document.querySelector("#startBtn");
        let countdown;

        startBtn.addEventListener("click", () => {
            clearInterval(countdown); // stop any old timer

            let minutes = parseInt(document.querySelector("#minutesInput").value) || 0;
            let seconds = parseInt(document.querySelector("#secondsInput").value) || 0;

            let timeLeft = minutes * 60 + seconds;

            if (timeLeft <= 0) {
                timerDisplay.textContent = "Enter valid time!";
                return;
            }

            countdown = setInterval(() => {
                let min = Math.floor(timeLeft / 60);
                let sec = timeLeft % 60;

                if (min < 10) {
                    min = "0" + min;
                }
                if (sec < 10) {
                    sec = "0" + sec;
                }

                timerDisplay.textContent = `${min}:${sec}`;
                timeLeft--;

                if (timeLeft < 0) {
                    clearInterval(countdown);
                    timerDisplay.textContent = "⏰ Time's up!";
               }
            }, 1000);
        });
    </script>
</body>

</html>
