<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Background Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background 0.5s ease;
    }

    h1 {
      color: white;
      text-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    .btn {
      padding: 10px 25px;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.05);
    }

    .color-code {
      margin-top: 15px;
      color: white;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 20px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>🎨 Gradient Background Generator</h1>
  <button class="btn" id="generateBtn">Generate Gradient</button>
  <div class="color-code" id="colorCode"></div>

  <script>
    const btn = document.querySelector("#generateBtn");
    const colorCode = document.querySelector("#colorCode");

    function randomColor() {
      let color = "#"+ Math.floor(Math.random()*16777215).toString(16).padStart(6,"0")
      return color;
    }

    function generateGradient() {
      const color1 = randomColor();
      const color2 = randomColor();
      const angle = Math.floor(Math.random() * 360);
      const gradient = `linear-gradient(${angle}deg, ${color1}, ${color2})`;

      document.body.style.background = gradient;
      colorCode.textContent = `${gradient}`;
    }

    btn.addEventListener("click", generateGradient);
    generateGradient(); // show one at start
  </script>
</body>
</html>
